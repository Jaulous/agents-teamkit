[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-teamkit"
version = "0.3.0"
description = "Agents TeamKit is a lightweight multi-agent team architecture kit for business workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["agents", "multi-agent", "workflow", "teamkit", "workbuddy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Libraries",
]

[project.scripts]
teamkit = "teamkit.cli:main"

[project.urls]
Homepage = "https://github.com/Jaulous/agents-teamkit"
Repository = "https://github.com/Jaulous/agents-teamkit"
Issues = "https://github.com/Jaulous/agents-teamkit/issues"

[tool.setuptools]
packages = ["teamkit"]
