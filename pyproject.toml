[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-teamkit"
version = "0.1.1"
description = "Agents TeamKit is a lightweight multi-agent team architecture kit for business workflows."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
teamkit = "teamkit.cli:main"

[tool.setuptools]
packages = ["teamkit"]
