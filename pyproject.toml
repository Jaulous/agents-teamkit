[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-agent-team-kit"
version = "0.1.0"
description = "A lightweight multi-agent team architecture kit for business workflows."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
teamkit = "teamkit.cli:main"

[tool.setuptools]
packages = ["teamkit"]
